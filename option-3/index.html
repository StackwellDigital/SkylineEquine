<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skyline Equine | Option 3, Rug Finder</title>
<link rel="icon" href="../images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../shared/shop.css">
<style>
/* Option 3, Rug Finder: warm, friendly, guided. The hero is a size + fill finder that drives the grid. */
:root {
  --bg: #faf6ef; --surface: #ffffff; --ink: #1f2a24; --muted: #66706a; --line: #e6dfd1; --sky: #f1ebdd;
  --accent: #1f5c46; --accent-ink: #ffffff; --good: #1f7a53; --radius: 14px; --maxw: 1180px; --gap: 22px; --card-min: 250px;
  --art-ratio: 5 / 4;
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #111915; --surface: #19231e; --ink: #eef3ef; --muted: #9baba2; --line: #2a3a32; --sky: #202e27; --accent: #6fcf9f; --accent-ink: #08170f; --good: #6fcf9f; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #111915; --surface: #19231e; --ink: #eef3ef; --muted: #9baba2; --line: #2a3a32; --sky: #202e27; --accent: #6fcf9f; --accent-ink: #08170f; --good: #6fcf9f; color-scheme: dark; }

header.top { display: flex; align-items: center; justify-content: space-between; padding-block: 16px; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; font-family: var(--font-display); font-weight: 700; font-size: 22px; }
.logo { width: 46px; height: 46px; border-radius: 12px; flex: none; }
.cartbtn { background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; padding: 10px 20px; font-weight: 600; }
.cartbtn b { margin-left: 8px; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 1px 9px; font-variant-numeric: tabular-nums; }

.finder { background: var(--sky); border-radius: 28px; padding: clamp(24px, 5vw, 56px); margin-top: 8px; display: grid; gap: 28px; }
.finder h1 { font-size: clamp(34px, 5.6vw, 64px); font-weight: 700; letter-spacing: -0.02em; max-width: 16ch; }
.finder p.lede { color: var(--muted); font-size: 18px; max-width: 52ch; margin-top: 12px; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.step { background: var(--surface); border-radius: var(--radius); padding: 18px; display: grid; gap: 10px; align-content: start; border: 1px solid var(--line); }
.step h2 { font-size: 15px; font-family: var(--font-body); font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.step .num { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 13px; margin-right: 8px; letter-spacing: 0; }
.step select { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 17px; }
.step .chips { gap: 6px; }
.step .chip { padding: 8px 14px; }
.step .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.step small { color: var(--muted); }
.finder .go { justify-self: start; }
.finder .btn { border-radius: 999px; }

.shophead { display: flex; justify-content: space-between; align-items: end; gap: 16px 24px; flex-wrap: wrap; margin-block: 48px 18px; }
.shophead h2 { font-size: 34px; }
.shophead .tools { display: flex; gap: 10px; flex-wrap: wrap; }
.tools input, .tools select { border-radius: 999px; padding: 10px 16px; }
#cats { margin-bottom: 22px; }
#cats .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.card { border-radius: var(--radius); box-shadow: 0 1px 2px rgba(31, 42, 36, 0.05); transition: transform 0.15s, box-shadow 0.15s; }
.card:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(31, 42, 36, 0.12); }
.card h3 { font-family: var(--font-display); font-size: 20px; }
.card .price { font-family: var(--font-display); }
.card .add { border-radius: 999px; }
.vault { margin-top: 56px; border: 0; background: var(--sky); border-radius: 24px; padding: 32px; }
.info { margin-top: 56px; padding-top: 40px; border-top: 1px solid var(--line); }
@media (max-width: 760px) {
  .steps { grid-template-columns: minmax(0, 1fr); }
  .finder { border-radius: 20px; }
}
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#top"><img class="logo" src="../images/logo.png" alt="Skyline Equine logo" width="46" height="46"><span>Skyline Equine</span></a>
    <button class="cartbtn" data-open-cart>Cart<b data-cart-count>0</b></button>
  </header>

  <section class="finder" id="top" aria-label="Rug finder">
    <div>
      <h1>Find the right Bucas rug.</h1>
      <p class="lede">Pick a size and how warm you want it. We will show only what fits.</p>
    </div>
    <div class="steps">
      <div class="step"><h2><span class="num">1</span>Rug size</h2><select id="size" aria-label="Rug size"></select><small>Back length in inches</small></div>
      <div class="step"><h2><span class="num">2</span>Fill weight</h2><div class="chips" id="fills" role="group" aria-label="Fill weight"></div><small>50g light, 300g heavy</small></div>
      <div class="step"><h2><span class="num">3</span>Type</h2><div class="chips" id="cats" role="group" aria-label="Category"></div></div>
    </div>
    <a class="btn primary go" href="#shop">Show matching products</a>
  </section>

  <div class="shophead" id="shop">
    <div><h2>The range</h2><span class="count" id="count" aria-live="polite"></span></div>
    <div class="tools">
      <input id="q" type="search" placeholder="Search" aria-label="Search products">
      <select id="sort" aria-label="Sort products"><option value="feat">Featured</option><option value="lo">Price, low to high</option><option value="hi">Price, high to low</option><option value="az">Name, A to Z</option></select>
    </div>
  </div>
  <div class="grid" id="grid"></div>

  <div id="vaulting"><div class="vault" data-slot="vault"></div></div>
  <section class="info" id="ordering" aria-label="Ordering information" data-slot="ordering"></section>
  <footer class="foot" id="contact" data-slot="footer"></footer>
</div>
<script src="../shared/data.js"></script>
<script>window.SHOP_CONFIG = { card: 'std' };</script>
<script src="../shared/shop.js" data-base="../"></script>
</body>
</html>
